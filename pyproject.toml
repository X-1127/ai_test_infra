[project]
name = "llm-mock-server"
version = "1.0.0"
description = "A mock LLM server for testing AI applications"
authors = [
    {name = "XY", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["llm", "mock", "server", "testing", "openai", "api", "desktop-app"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]
desktop = [
    "PyQt6>=6.6.0",
    "httpx>=0.27.0",
]
build = [
    "pyinstaller>=6.0.0",
    "pyinstaller-hooks-contrib>=2024.0",
]

[project.scripts]
llm-mock-server = "app.main:app"
llm-mock-desktop = "desktop.main:main"

[project.gui-scripts]
llm-mock-desktop-gui = "desktop.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/llm-mock-server"
Documentation = "https://github.com/yourusername/llm-mock-server#readme"
Repository = "https://github.com/yourusername/llm-mock-server"
Issues = "https://github.com/yourusername/llm-mock-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "desktop"]

[tool.hatch.build.targets.wheel.shared-data]
"config/responses.yaml.example" = "llm_mock_server/config/responses.yaml.example"

[tool.hatch.build.targets.sdist]
packages = ["app", "desktop", "config", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyinstaller]
name = "LLM_Mock_Server_Desktop"
console = false
icon = "assets/icon.ico"
onefile = true
windowed = true
add_data = [
    "config/responses.yaml.example;config",
]
hidden_imports = [
    "PyQt6",
    "PyQt6.QtCore",
    "PyQt6.QtGui",
    "PyQt6.QtWidgets",
    "app",
    "app.main",
    "app.config",
    "app.models",
    "app.api.chat",
    "app.api.logs",
    "app.services.mock_service",
    "app.services.response_config_manager",
    "app.services.log_manager",
    "desktop",
    "desktop.main",
    "desktop.config.settings",
    "desktop.services.api_client",
    "desktop.services.server_manager",
    "desktop.ui.main_window",
    "desktop.ui.server_tab",
    "desktop.ui.config_tab",
    "desktop.ui.logs_tab",
    "desktop.ui.test_tab",
    "desktop.ui.monitor_tab",
    "desktop.ui.rule_edit_dialog",
]
exclude_module = [
    "tkinter",
    "matplotlib",
    "numpy",
    "pandas",
]
collect_data_files = true
strip = false
upx = true
optimize = 0